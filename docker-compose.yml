services:
  app:
    build: .
    image: nuevamente-app:latest
    container_name: nuevamente-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: streamlit          # cambiar a "api" para levantar FastAPI en su lugar
      STREAMLIT_PORT: 8501
    ports:
      - "8501:8501"
    volumes:
      - ./data/chroma:/app/data/chroma          # persistencia del Vector Store
      - ./data/documents:/app/data/documents    # copia local de documentos ingeridos
      - ${OCI_CONFIG_HOST_PATH:-~/.oci}:/root/.oci:ro   # credenciales OCI (solo lectura)

  # Servicio opcional: exponer la misma app como API REST en paralelo (otro puerto)
