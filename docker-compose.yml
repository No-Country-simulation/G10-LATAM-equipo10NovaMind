services:
  backend:
    build: ./backend
    image: nuevamente-backend:latest
    container_name: nuevamente-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"          # expuesto también al host, útil para probar con curl/Swagger
    volumes:
      - ./backend/data/chroma:/app/data/chroma
      - ./backend/data/documents:/app/data/documents
      - ${OCI_CONFIG_HOST_PATH:-~/.oci}:/root/.oci:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    image: nuevamente-frontend:latest
    container_name: nuevamente-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      # Dentro de la red de Docker Compose, los servicios se resuelven por
      # su nombre ("backend"), no por localhost/127.0.0.1.
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy   # el frontend no arranca hasta que /health del backend responda

# No hace falta declarar una red manualmente: Docker Compose crea una red
# bridge por defecto donde "backend" y "frontend" se resuelven entre sí
# por nombre de servicio (DNS interno de Compose).
